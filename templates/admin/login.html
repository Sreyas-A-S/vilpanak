<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Vilpanak</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-indigo-500/30">
                V
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Admin Sign In</h1>
            <p class="text-sm text-slate-400">Enter your credentials to access the management portal</p>
        </div>

        {{if .Error}}
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-4 rounded-xl">
            {{.Error}}
        </div>
        {{end}}

        <form action="/admin/login" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" required placeholder="admin@vilpanak.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">
                Sign In
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition">&larr; Back to public website</a>
        </div>
    </div>
</body>
</html>
